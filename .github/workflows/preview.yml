name: Preview on Cloudflare Pages

# Despliega ramas que no son main como preview (URL <rama>.web-*.pages.dev).
# No toca la web publicada (producción = main).
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production
          # Web app de Apps Script (reservas → Sheet + contrato + email). Es pública por diseño.
          NEXT_PUBLIC_BOOKING_ENDPOINT: https://script.google.com/macros/s/AKfycbzsbb_HmKLSnk6MVKoSVfhkA-WLQQ7SPhrsFke19q_nwt99ulncsNYg62fM4zKz26xG/exec
      - name: Publish preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=web --branch=${{ github.ref_name }} --commit-dirty=true
